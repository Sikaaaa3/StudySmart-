<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Results | StudySmart</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header class="site-header">
    <a class="logo" href="index.html">StudySmart<span>.</span></a>
    <nav aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="flashcards.html">Flashcards</a>
      <a href="quiz.html">Quiz</a>
    </nav>
  </header>

  <main class="results-page">
    <section class="results-heading">
      <p class="eyebrow">YOUR LEARNING JOURNEY</p>
      <h1>Quiz <span>Results</span></h1>
      <p>Review your latest quiz performance.</p>
    </section>

    <section class="results-card">
      <p class="result-label">YOUR LATEST SCORE</p>

      <h2 id="result-percentage">--%</h2>
      <p id="result-score">Complete a quiz to see your score.</p>
      <p id="result-date"></p>

      <div class="result-progress">
        <div id="result-progress-bar"></div>
      </div>

      <p id="result-message"></p>

      <div class="result-actions">
        <a href="quiz.html" class="primary-button">Take Another Quiz</a>
        <a href="index.html" class="secondary-button">Back to Home</a>
      </div>
    </section>
  </main>

  <footer>
    <p>StudySmart · Your notes, your practice, your progress.</p>
  </footer>

  <script src="js/app.js"></script>
</body>

</html>
